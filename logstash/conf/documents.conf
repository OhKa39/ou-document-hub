# backend/src/main/resources/logstash/migration.conf
input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/logstash-core/lib/jars/postgresql-42.7.3.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://db:5432/OUDocumentHub_db"
    jdbc_user => "documenthub_db"
    jdbc_password => "1234567890"
    schedule => "*/5 * * * *"
    statement => """
      SELECT 
        COALESCE(d.id, gen_random_uuid()) AS document_id,
        COALESCE(d.document_type, 'Online') AS document_type,
        COALESCE(d.document_name, 'Default Document') AS document_name,
        d.status,
        TO_CHAR(d.created_at AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.US"Z"') AS created_at,
        TO_CHAR(d.updated_at AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.US"Z"') AS updated_at,
        d.description,
        COALESCE(d.short_url, '') AS short_url,
        d.tag,
        COALESCE(d.price, 0)::FLOAT AS price,
        COALESCE(d.thumbnail_url, '')::TEXT AS thumbnail_url,
        COALESCE(d.is_deleted, false) AS active,
        f.id AS university_id,
        COALESCE(f.title, '') AS university_name,
        od.file_type AS online_file_type,
        od.file_url AS file_url,
        COALESCE(pd.quantity, 0) AS stock,
        COALESCE(AVG(c.rating)::FLOAT, 0.0) AS rating,
        ARRAY_AGG(DISTINCT di.image_url) FILTER (WHERE di.image_url IS NOT NULL) AS images,
        ARRAY_AGG(DISTINCT sa.address_name) FILTER (WHERE sa.address_name IS NOT NULL) AS addresses,
        CAST(
          json_build_object(
            'id', u.id,
            'email', COALESCE(u.email, ''),
            'avatar_url', COALESCE(u.avatar_url, ''),
            'first_name', COALESCE(u.first_name, ''),
            'last_name', COALESCE(u.last_name, '')
          ) AS TEXT
        ) AS created_by
      FROM documents d
      LEFT JOIN universities f ON d.university_id = f.id
      LEFT JOIN online_files od ON d.id = od.file_id
      LEFT JOIN paper_copies pd ON d.id = pd.id
      LEFT JOIN paper_copy_addresses pca ON pd.id = pca.copy_id
      LEFT JOIN addresses sa ON pca.address_id = sa.id
      LEFT JOIN document_images di ON d.id = di.document_id
      LEFT JOIN reviews c ON d.id = c.document_id AND c.is_deleted = false
      LEFT JOIN users u ON d.created_by_id = u.id
      GROUP BY 
        d.id,
        od.file_type,
        od.file_url,
        pd.quantity,
        f.id,
        u.id
    """
    clean_run => false
  }
}

filter {
  mutate {
    copy => { "document_id" => "[@metadata][document_id]" }
    remove_field => ["@version"]
  }

  if [document_id] == "" {
    mutate {
      add_field => { "document_id" => "%{[UUID]}" }
    }
  }
  if [document_type] == "" {
    mutate {
      add_field => { "document_type" => "Online" }
    }
  }
  if [document_name] == "" {
    mutate {
      add_field => { "document_name" => "Default Document" }
    }
  }
  date {
    match => ["created_at", "yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'", "yyyy-MM-dd'T'HH:mm:ss.SSSSSSSSSSX", "yyyy-MM-dd'T'HH:mm:ss.SSSSSS", "ISO8601"]
    target => "created_at"
    timezone => "UTC"
    add_field => { "created_at" => "%{created_at}Z" }
    remove_tag => ["_dateparsefailure"]
  }

  date {
    match => ["updated_at", "yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'", "yyyy-MM-dd'T'HH:mm:ss.SSSSSSX", "yyyy-MM-dd'T'HH:mm:ss.SSSSSS", "ISO8601"]
    target => "updated_at"
    timezone => "UTC"
    add_field => { "updated_at" => "%{updated_at}Z" }
    remove_tag => ["_dateparsefailure"]
  }

  if [created_at] == null {
    mutate {
      add_field => { "created_at" => "%{[@timestamp]}Z" }
    }
  }
  if [updated_at] == null {
    mutate {
      add_field => { "updated_at" => "%{[@timestamp]}Z" }
    }
  }

  json {
    source => "created_by_user"
    target => "created_by_user"
  }

  ruby {
    code => '
      if document.get("document_name")
        name = document.get("document_name")
        parts = name.split(" ")
        inputs = parts + [name]
        document.set_field("document_name_suggest", { "input" => inputs.unique() })
      end
    '
  }

  mutate {
    remove_field => ["tags"]
  }
}

output {
  elastic {
    hosts => ["http://host.docker.internal:9200"]
    index => "documents_v2"
    document_id => "%{[metadata][document_id]}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
  }
  stdout {
    codec => "json"
  }
}
