# Logstash configuration to sync chat_rooms table from PostgreSQL to Elasticsearch
# Syncs room_id with incremental updates based on updated_at or created_at

input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/logstash-core/lib/jars/postgresql-42.7.3.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://db:5432/OUDocumentHub_db"
    jdbc_user => "documenthub_db"
    jdbc_password => "1234567890"
    schedule => "*/5 * * * *" # Run every 5 seconds for frequent updates
    statement => "
      SELECT room_id, created_at, updated_at
      FROM chat_rooms
      WHERE updated_at > :sql_last_value OR created_at > :sql_last_value
    "
    use_column_value => true
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/.logstash_jdbc_last_run_chat_rooms"
    clean_run => false # Incremental sync
  }
}

filter {
  mutate {
    copy => { "room_id" => "[@metadata][document_id]" }
    convert => { "room_id" => "string" }
    rename => { "room_id" => "id" }
    remove_field => ["@version", "updated_at"]
  }
  date {
    match => ["created_at", "ISO8601"]
    target => "created_at"
  }
}

output {
  elasticsearch {
    hosts => ["http://host.docker.internal:9200"]
    index => "chat_rooms"
    document_id => "%{[@metadata][document_id]}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
  }
  stdout { codec => rubydebug } # For debugging
}
